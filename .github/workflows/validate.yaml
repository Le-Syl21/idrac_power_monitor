name: Validate

# Manual only: the HACS license check cannot pass here, as the upstream project
# never had a license and a fork cannot pick one for its authors (the action
# offers no way to ignore that check). Installing as a custom repository does
# not need it. Run it by hand to check everything else.
on:
  workflow_dispatch:

jobs:
  validate-hacs:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7.0.1"
      - name: HACS validation
        # Its releases are years behind the checks HACS applies today
        uses: "hacs/action@main"
        with:
          category: "integration"
